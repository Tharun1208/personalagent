<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E82EE" />
      <stop offset="50%" stop-color="#9B72CF" />
      <stop offset="100%" stop-color="#F27878" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Hexagon -->
  <rect width="512" height="512" rx="128" fill="#0c111d" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#nexusGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Core AI Orbit / Hexagon -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" 
           fill="url(#nexusGrad)" filter="url(#glow)" />

  <!-- Inner Geometric Aperture -->
  <polygon points="256,140 356,198 356,314 256,372 156,314 156,198" 
           fill="#0c111d" opacity="0.92" />

  <!-- Central Nexus Spark -->
  <path d="M256,170 L276,236 L342,256 L276,276 L256,342 L236,276 L170,256 L236,236 Z" 
        fill="url(#nexusGrad)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glow)" />
</svg>
